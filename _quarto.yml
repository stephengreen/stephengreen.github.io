project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"
    - "!CLAUDE.md"
  resources:
    - CNAME
    - .nojekyll

  preview:
    port: 22222
    browser: true
    watch-inputs: true
    navigate: true

website:
  title: "Stephen Green"
  image: "profile.jpg"
  site-url: https://stephenrgreen.com
  description: "{{< var description >}}"
  open-graph: true
  twitter-card: true

  navbar:
    background: light
    pinned: true

    left:
      - text: "Research"
        href: research/index.qmd
      - text: "Publications"
        href: publications/index.qmd
      - text: "Talks"
        href: talks/index.qmd
      - text: "Group"
        href: team/index.qmd
      - text: "News"
        href: blog/index.qmd
      - text: "CV"
        href: cv/index.qmd

  search:
    location: navbar
    type: textbox

  page-footer:
    left: |
      School of Mathematical Sciences
      <br>University of Nottingham
    center: |
      [{{< iconify academicons:google-scholar size=1.3em >}}](https://scholar.google.com/citations?user={{< var google-scholar >}}&hl=en)&ensp;
      [{{< iconify academicons:orcid size=1.3em >}}](https://orcid.org/{{< var orcid >}})&ensp;
      [{{< iconify academicons:inspire size=1.3em >}}](https://inspirehep.net/authors/{{< var inspire >}})
    right: |
      <script>document.write('&copy; ' + new Date().getFullYear() + ' Stephen Green')</script>
      Built with [Quarto](https://quarto.org) · [Source](https://github.com/stephengreen/stephengreen.github.io)

bibliography: [references/INSPIRE.bib, references/references-other.bib]
csl: references/aps.csl

execute:
  freeze: true

format:
  html:
    fontsize: 1.05em
    theme:
      light: [default, styles/theme-light.scss, styles/custom.scss]
      dark: [default, styles/theme-dark.scss, styles/custom.scss]
    toc: true
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true
    include-after-body:
      text: |
        <!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "bf023192c0324f4a92b10192c2ed17c0"}'></script><!-- End Cloudflare Web Analytics -->
